<style>
/* Layout: one column "activity sheet" on a sky-and-grass ground; picture card, crayon tray, tracing strip. Single bright look on purpose. */
:root {
  --sky: #dff1fb;
  --grass: #8fd16a;
  --paper: #ffffff;
  --ink: #1d2a33;
  --barn: #d8432f;
  --soft: #5b6b75;
  --line: #1d2a33;
  --sun: #ffd437;
  --display: "Fredoka", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --school: "Andika", "Fredoka", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--sky); }
body {
  background: linear-gradient(to bottom, var(--sky) 0, var(--sky) calc(100% - 90px), var(--grass) calc(100% - 90px));
  color: var(--ink);
  font-family: var(--display);
  min-height: 100%;
  padding-block: 18px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 18px; }

header { display: grid; gap: 12px; justify-items: center; text-align: center; }
.brand {
  font-weight: 700; font-size: clamp(34px, 8vw, 58px); line-height: .95; margin: 0;
  color: #fff; letter-spacing: .02em; text-wrap: balance;
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
  text-shadow: 4px 4px 0 var(--ink);
}
.brand small { display: block; font-size: .42em; letter-spacing: .12em; color: var(--barn); -webkit-text-stroke: 0; text-shadow: none; margin-top: 8px; }

.pages { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding: 4px 2px 8px; scrollbar-width: thin; }
.chip {
  flex: none; font: 600 16px var(--display); color: var(--ink); background: var(--paper);
  border: 3px solid var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  box-shadow: 0 3px 0 var(--ink); display: inline-flex; gap: 6px; align-items: center;
}
.chip[aria-current="true"] { background: var(--sun); }
.chip .star { color: var(--barn); }
.chip:focus-visible, button:focus-visible { outline: 3px dashed var(--barn); outline-offset: 3px; }

.card { background: var(--paper); border: 4px solid var(--ink); border-radius: 26px; box-shadow: 0 6px 0 var(--ink); padding: 14px; display: grid; gap: 12px; }
.card h2 { margin: 0; font-weight: 700; font-size: clamp(24px, 6vw, 34px); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card h2 .count { font-size: 16px; font-weight: 600; color: var(--soft); font-variant-numeric: tabular-nums; }

#scene { width: 100%; height: auto; display: block; touch-action: manipulation; user-select: none; }
#scene .r { cursor: pointer; }
#scene .r:hover > * { filter: brightness(.97); }
#scene text { pointer-events: none; font: 600 26px var(--display); paint-order: stroke; stroke: #fff; stroke-width: 6px; stroke-linejoin: round; fill: var(--ink); }

.tray { display: flex; flex-wrap: wrap; gap: 8px; }
.crayon {
  position: relative; border: 3px solid var(--ink); border-radius: 14px; background: var(--paper);
  padding: 6px 10px 6px 6px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font: 600 15px var(--display); color: var(--ink); min-height: 48px;
}
.crayon .sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.crayon[aria-pressed="true"] { transform: translateY(-3px); box-shadow: 0 5px 0 var(--ink); background: #fff7cf; }
.crayon.more { color: var(--soft); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: 600 15px var(--display); color: var(--ink); background: var(--paper); border: 3px solid var(--ink);
  border-radius: 12px; padding: 8px 12px; cursor: pointer; min-height: 44px;
}
.btn.primary { background: var(--sun); }
.btn:active { transform: translateY(2px); }

.done { display: none; align-items: center; gap: 10px; background: #fff7cf; border: 3px dashed var(--barn); border-radius: 16px; padding: 10px 12px; font-weight: 600; font-size: 18px; }
.done.show { display: flex; }

.trace-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.trace-box { position: relative; width: 100%; aspect-ratio: 700 / 230; max-width: 100%; border-radius: 16px; border: 3px solid var(--ink); overflow: hidden; background: var(--paper); touch-action: none; }
.trace-box svg, .trace-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.trace-box canvas { cursor: crosshair; }
.meter { height: 14px; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; background: var(--paper); }
.meter i { display: block; height: 100%; width: 0; background: var(--grass); transition: width .25s; }
.hint { margin: 0; color: var(--soft); font-size: 15px; font-weight: 500; }

#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; width: 100%; height: 100%; }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }
</style>

  [...$('pages').children].forEach((b, i) => {
    const p = DATA.pages[i], f = state.fills[i] || {};
    const ok = p.regions.every((r, j) => !r[2] || f[j] === r[1]);
    const tr = state.traced[i];
    b.innerHTML = `${i === 0 ? 'Farm' : p.name}${ok ? ' <span class="star" aria-label="coloured">★</span>' : ''}${tr ? ' <span class="star" aria-label="traced">✎</span>' : ''}`;
  });
}
function buildChips() {
  $('pages').innerHTML = DATA.pages.map((p, i) => `<button class="chip" type="button" data-p="${i}" aria-current="${i === page}"></button>`).join('');
  markChips();
}
$('pages').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) go(+b.dataset.p); });
function go(i) {
  page = i; history = []; crayon = null;
  [...$('pages').children].forEach((b, j) => b.setAttribute('aria-current', j === i));
  $('pages').children[i].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  buildScene(); buildTray(); buildTrace(); save();
}
$('tnext').onclick = () => { go((page + 1) % DATA.pages.length); window.scrollTo({ top: 0, behavior: 'smooth' }); };

/* ---------- tracing ---------- */
const can = $('tcan'), ctx = can.getContext('2d');
let mask = null, maskCount = 0, letterPath = null, drawing = false, last = null;
function word() { return page === 0 ? 'farm' : DATA.pages[page].name.toLowerCase(); }
function buildTrace() {
  const d = DATA.pages[page].trace;
  $('tr-word').textContent = word();
  $('tsvg').innerHTML = `
    <path d="M24 40 H676" stroke="#1d2a33" stroke-width="3"/>
    <path d="M24 105 H676" stroke="#1d2a33" stroke-width="2.5" stroke-dasharray="12 10"/>
    <path d="M24 170 H676" stroke="#d8432f" stroke-width="4"/>
    <path d="${d}" fill="#fff" stroke="#fff" stroke-width="10"/>
    <path d="${d}" fill="#fff" stroke="#1d2a33" stroke-width="3.5" stroke-dasharray="8 7" stroke-linecap="round"/>`;
  letterPath = new Path2D(d);
  sizeCanvas();
}
function sizeCanvas() {
  const r = can.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  can.width = Math.round(r.width * dpr); can.height = Math.round(r.height * dpr);
  ctx.setTransform(can.width / 700, 0, 0, can.height / 230, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 15;
  setPen();
  // letter mask at low resolution for scoring
  const m = document.createElement('canvas'); m.width = 175; m.height = 58;
  const mc = m.getContext('2d'); mc.setTransform(0.25, 0, 0, 0.25, 0, 0); mc.fill(letterPath);
  mask = mc.getImageData(0, 0, 175, 58).data; maskCount = 0;
  for (let i = 3; i < mask.length; i += 4) if (mask[i] > 128) maskCount++;
  score();
}
function setPen() {
  const c = crayon && crayon !== 0 ? crayon : 6;
  ctx.strokeStyle = DATA.palette[c][1];
}
function pt(e) { const r = can.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 700, (e.clientY - r.top) / r.height * 230]; }
can.addEventListener('pointerdown', e => { drawing = true; last = pt(e); can.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(last[0] + .1, last[1]); ctx.stroke(); });
can.addEventListener('pointermove', e => { if (!drawing) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; });
const end = () => { if (!drawing) return; drawing = false; score(); };
can.addEventListener('pointerup', end); can.addEventListener('pointercancel', end);
function score() {
  if (!maskCount) return;
  const s = document.createElement('canvas'); s.width = 175; s.height = 58;
  const sc = s.getContext('2d'); sc.drawImage(can, 0, 0, 175, 58);
  const ink = sc.getImageData(0, 0, 175, 58).data;
  let hit = 0, out = 0;
  for (let i = 3; i < ink.length; i += 4) { if (ink[i] > 40) { if (mask[i] > 128) hit++; else out++; } }
  const pct = Math.min(1, hit / maskCount / 0.6);
  $('tmeter').style.width = `${Math.round(pct * 100)}%`;
  if (pct >= 1) {
    if (!state.traced[page]) { state.traced[page] = true; save(); markChips(); confetti(); pop(700); }
    $('thint').textContent = `Great tracing! You wrote "${word()}".`;
  } else $('thint').textContent = hit === 0 ? 'Use your finger to go over the dotted letters. Your crayon colour is the pen colour.' : 'Keep going, fill in every letter.';
}
$('tclear').onclick = () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, can.width, can.height); ctx.restore(); score(); };
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(sizeCanvas, 150); });

/* ---------- little rewards ---------- */
let actx = null;
function pop(f) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f, actx.currentTime); o.frequency.exponentialRampToValueAtTime(f * 1.6, actx.currentTime + .08);
    g.gain.setValueAtTime(.12, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .15);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .16);
  } catch (e) {}
}
function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('confetti'), x = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const cols = Object.values(DATA.palette).map(v => v[1]);
  const bits = Array.from({ length: 120 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, r: 4 + Math.random() * 5, a: Math.random() * 6, col: cols[Math.floor(Math.random() * cols.length)] }));
  let t = 0;
  (function step() {
    x.clearRect(0, 0, c.width, c.height);
    bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.a += .1; x.fillStyle = b.col; x.save(); x.translate(b.x, b.y); x.rotate(b.a); x.fillRect(-b.r, -b.r / 2, b.r * 2, b.r); x.restore(); });
    if (++t < 140) requestAnimationFrame(step); else x.clearRect(0, 0, c.width, c.height);
  })();
}

/* ---------- start ---------- */
$('nums').textContent = `Numbers: ${state.nums ? 'on' : 'off'}`; $('nums').setAttribute('aria-pressed', state.nums);
buildChips(); buildScene(); buildTray(); buildTrace();
document.fonts?.ready.then(() => drawLabels());
</script>

</body></html>
